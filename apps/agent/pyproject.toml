[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "fastapi>=0.118",
  "uvicorn[standard]>=0.37",
  "sse-starlette>=3.0",
  "pydantic-settings>=2.10",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
langfuse = ["langfuse>=3.5"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "ruff>=0.13",
  "langgraph-cli[inmem]>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
