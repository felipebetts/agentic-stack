# Dev local. Em dev o fluxo mais rápido é `make db` + `make dev-agent`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 2s
      retries: 20

  agent:
    build: ./apps/agent
    env_file: ./apps/agent/.env
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent
      # O web (Better Auth) roda fora do compose, via `make dev-web`
      AUTH_JWKS_URL: http://host.docker.internal:3000/api/auth/jwks
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
