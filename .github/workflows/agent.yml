name: agent

on:
  push:
    branches: [main]
    paths: ["apps/agent/**", "apps/web/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["apps/agent/**", "apps/web/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: cd apps/agent && uv sync --frozen
      - run: cd apps/agent && uv run ruff check . && uv run ruff format --check .
      - run: cd apps/agent && uv run pytest
      - run: cd apps/web && pnpm install --frozen-lockfile
      - name: Contrato API <-> web atualizado
        run: make check-contract
      - run: cd apps/web && pnpm lint && pnpm typecheck && pnpm test

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/agent
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/agent:${{ github.sha }}
            ghcr.io/${{ github.repository }}/agent:latest
      # Próximo passo: job de deploy via SSH (docker compose pull && up -d)
